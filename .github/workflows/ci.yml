name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Kotoba conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Clojure CLI
        uses: DeLaGuardo/setup-clojure@13.1
        with:
          cli: latest
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enforce Kotoba production source authority
        shell: bash
        run: |
          if find src -type f \( -name '*.clj' -o -name '*.cljc' -o -name '*.cljs' \) -print -quit | grep -q .; then
            echo 'Production Clojure-family source must use .kotoba.' >&2
            exit 1
          fi
          test "$(find src -type f -name '*.kotoba' | wc -l)" -eq 1
      - name: Run tests
        run: clojure -M:test
      - name: Lint
        run: clojure -M:lint
